[workspace]
members = [
  "general/echo/kmdf/driver/*",
  "general/echo/kmdf/exe",
  "tools/dv/kmdf/fail_driver_pool_leak",
]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false
repository = "https://github.com/microsoft/windows-rust-driver-samples"
license = "MIT OR Apache-2.0"

[workspace.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[workspace.dependencies]
anyhow = "1.0.103"
paste = "1.0.14"
wdk = { version = "0.5.0", default-features = false }
wdk-alloc = { version = "0.4.2", default-features = false }
wdk-build = { version = "0.6.0", default-features = false }
wdk-panic = { version = "0.5.0", default-features = false }
wdk-sys = { version = "0.5.2", default-features = false }
